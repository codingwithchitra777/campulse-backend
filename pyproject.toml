[project]
name = "cambopulse-api"
version = "1.0.1"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "requests",
    "cachetools",
    "pydantic",
    "matplotlib",
    "pytz",
    "fastapi[standard]<0.137.0",
    "uvicorn",
    "psycopg2-binary",
    "logfire[fastapi]",
    "pyjwt",
    "redis",
    "anthropic",
    # Khmer voice-message transcription (Telegram bot) — services/transcriber.
    # torch comes from the CPU-only index below (the default Linux wheel pulls
    # in several GB of CUDA libraries we can't use).
    "torch",
    "transformers",
    "soundfile",
    "scipy",
    "numpy",
]

# Gold-board photo OCR (Telegram admin flow) is OPTIONAL — these are heavy
# (onnxruntime + opencv) and can break a slim cloud build. `services/gold_ocr`
# imports them lazily and the bot degrades to "OCR not available" without them.
# Install where you want the photo flow to run:  pip install '.[ocr]'
[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime",
    "opencv-python-headless",
    "numpy",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.logfire]
ignore_no_config = true
